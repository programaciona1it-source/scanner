<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Scanner QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d0d;--accent:#00e5ff;--ok:#00e676;--err:#ff4b6e;--warn:#ffb300;--text:#f0f0f0;--muted:#666}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222;flex-shrink:0}
header h1{font-size:14px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
#counter{font-size:11px;color:var(--muted);background:#1e1e1e;padding:3px 10px;border-radius:20px}
#counter span{color:var(--ok);font-weight:bold}
.tabs{display:flex;border-bottom:1px solid #222;flex-shrink:0}
.tab{flex:1;padding:11px;text-align:center;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#reader{width:100%;max-height:50dvh;flex-shrink:0;background:#000}
#reader video{width:100% !important;height:100% !important;object-fit:cover}
#reader img{display:none}
.state-bar{padding:9px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1a1a1a;flex-shrink:0;min-height:44px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.esperando{background:var(--accent);box-shadow:0 0 6px var(--accent);animation:pulse 1s infinite}
.dot.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dot.err{background:var(--err)}
.dot.warn{background:var(--warn);box-shadow:0 0 6px var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#estado-texto{font-size:12px;flex:1}
.preview-bar{padding:6px 16px;font-size:9px;color:#444;word-break:break-all;border-bottom:1px solid #111;min-height:30px;flex-shrink:0}
.log-wrap{flex:1;overflow-y:auto;padding:4px 0}
.log-item{display:flex;align-items:flex-start;gap:8px;padding:7px 14px;border-bottom:1px solid #111}
.log-item .ico{font-size:13px;flex-shrink:0;padding-top:1px}
.log-item .info{flex:1;min-width:0}
.log-item .nombre{font-size:12px;color:var(--text);font-weight:bold}
.log-item .sub{font-size:9px;color:var(--muted);margin-top:2px}
.log-item .ts{font-size:9px;color:#333;flex-shrink:0;align-self:center}
.btn-manual{margin:6px 14px;padding:9px;background:#1e1e1e;border:1px solid #2a2a2a;color:var(--muted);font-family:inherit;font-size:10px;border-radius:8px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;width:calc(100% - 28px)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-bg.open{display:flex}
.modal{background:#181818;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:22px 18px 30px}
.modal h3{font-size:12px;color:var(--accent);letter-spacing:2px;margin-bottom:14px;text-transform:uppercase}
.modal input{width:100%;padding:11px;background:#111;border:1px solid #333;color:var(--text);font-family:inherit;font-size:12px;border-radius:8px;margin-bottom:8px}
.modal input:focus{outline:none;border-color:var(--accent)}
.modal-btns{display:flex;gap:8px;margin-top:4px}
.modal-btns button{flex:1;padding:11px;border:none;border-radius:8px;font-family:inherit;font-size:11px;cursor:pointer}
.btn-ok{background:var(--accent);color:#000;font-weight:bold}
.btn-cancel{background:#2a2a2a;color:var(--muted)}
</style>
</head>
<body>

<header>
  <h1>⚡ Scanner</h1>
  <div id="counter">Guardados: <span id="cnt">0</span></div>
</header>

<div class="tabs">
  <button class="tab active" onclick="setMode('ambos',this)">Guía + QR</button>
  <button class="tab" onclick="setMode('solo_qr',this)">Solo QR</button>
</div>

<main>
  <div id="reader"></div>
  <div class="state-bar">
    <div class="dot esperando" id="dot"></div>
    <div id="estado-texto">Iniciando cámara...</div>
  </div>
  <div class="preview-bar" id="preview">—</div>
  <button class="btn-manual" onclick="abrirManual()">✏ Entrada manual</button>
  <div class="log-wrap" id="log"></div>
</main>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>Entrada Manual</h3>
    <input id="m-guia" placeholder="Guía (45XXXXXXX) — vacío si es solo QR" maxlength="9" inputmode="numeric">
    <input id="m-qr" placeholder="QR completo" style="font-size:10px">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="cerrarManual()">Cancelar</button>
      <button class="btn-ok" onclick="guardarManual()">Guardar</button>
    </div>
  </div>
</div>

<script>
// ============ CONFIG ============
const FORM_URL      = "https://docs.google.com/forms/d/e/1FAIpQLSevZQcgCF9SXA8vYTR1kij0E-yuFyZCrNG9HQs48sjQE3TX7w/formResponse";
const FIELD_GUIA    = "entry.773642673";
const FIELD_ID_QR = "entry.1128661543";
const FIELD_QR      = "entry.1584746756";
const FIELD_MODO    = "entry.1737704567";
// ================================

let modo = "ambos";
let etapa = "guia";
let guiaActual = "";
let contadorOk = 0;
let escaneando = false;
let ultimoTexto = "";
let ultimoTs = 0;
let scanner = null;

function extraerID(txt) {
  const m = txt.match(/['"]id['"]\s*:\s*['"](\d+)['"]/);
  return m ? m[1] : null;
}
function esGuia(txt) { return /^45\d{7}$/.test(txt.trim()); }
function esQR(txt) { return txt.includes("id") && txt.includes("hash_code") && txt.includes("sender_id"); }

function setMode(m, el) {
  modo = m;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  resetEtapa();
}

function resetEtapa() {
  escaneando = false;
  ultimoTexto = "";
  if (modo === "ambos") {
    etapa = "guia"; guiaActual = "";
    setEstado("esperando", "Escaneá la guía (45XXXXXXX)");
  } else {
    etapa = "qr";
    setEstado("esperando", "Escaneá el QR");
  }
  document.getElementById("preview").textContent = "—";
}

function setEstado(tipo, txt) {
  document.getElementById("dot").className = "dot " + tipo;
  document.getElementById("estado-texto").textContent = txt;
}

function iniciarScanner() {
  scanner = new Html5Qrcode("reader");
  const config = { fps: 15, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
  Html5Qrcode.getCameras().then(cameras => {
    if (!cameras || cameras.length === 0) { setEstado("err", "No se encontró cámara"); return; }
    const cam = cameras.find(c => /back|rear|environment/i.test(c.label)) || cameras[cameras.length - 1];
    scanner.start(cam.id, config, onScan, () => {}).then(() => {
      setEstado("esperando", modo === "ambos" ? "Escaneá la guía (45XXXXXXX)" : "Escaneá el JSON");
    }).catch(() => setEstado("err", "Error al iniciar cámara"));
  }).catch(() => {
    scanner.start({ facingMode: "environment" }, config, onScan, () => {}).then(() => {
      setEstado("esperando", modo === "ambos" ? "Escaneá la guía (45XXXXXXX)" : "Escaneá el JSON");
    }).catch(() => setEstado("err", "Sin acceso a cámara. Verificá permisos."));
  });
}

function onScan(txt) {
  if (escaneando) return;
  const ahora = Date.now();
  if (txt === ultimoTexto && ahora - ultimoTs < 2000) return;
  ultimoTexto = txt;
  ultimoTs = ahora;
  document.getElementById("preview").textContent = txt.length > 90 ? txt.slice(0,90)+"…" : txt;

  if (modo === "ambos") {
    if (etapa === "guia") {
      if (esGuia(txt)) {
        guiaActual = txt; etapa = "json";
        vibrar(50);
        setEstado("warn", "✓ Guía " + txt + " — escaneá el JSON");
      } else {
        setEstado("err", "✗ Guía inválida (45XXXXXXX)");
        vibrar(200);
        setTimeout(() => setEstado("esperando", "Escaneá la guía (45XXXXXXX)"), 1500);
      }
    } else {
      if (esJSON(txt)) {
        const id = extraerID(txt);
        if (!id) { setEstado("err", "✗ No se extrajo ID"); vibrar(200); return; }
        vibrar([50,30,50]);
        procesarCompleto(guiaActual, id, txt, "guia+json");
        resetEtapa();
      } else if (esGuia(txt)) {
        guiaActual = txt; vibrar(50);
        setEstado("warn", "✓ Guía " + txt + " — escaneá el JSON");
      } else {
        setEstado("err", "✗ No es JSON válido");
        vibrar(200);
        setTimeout(() => setEstado("warn", "✓ Guía " + guiaActual + " — escaneá el JSON"), 1500);
      }
    }
  } else {
    if (esJSON(txt)) {
      const id = extraerID(txt);
      if (!id) { setEstado("err", "✗ No se extrajo ID"); vibrar(200); return; }
      vibrar([50,30,50]);
      procesarCompleto("", id, txt, "solo_json");
    } else {
      setEstado("err", "✗ No es JSON válido");
      vibrar(200);
      setTimeout(() => setEstado("esperando", "Escaneá el JSON"), 1500);
    }
  }
}

function vibrar(p) { if (navigator.vibrate) navigator.vibrate(p); }

// ---- Enviar a Sheet ----
async function procesarCompleto(guia, idJson, jsonCompleto, modoUsado) {
  escaneando = true;
  const nombreFoto = (modoUsado === "guia+json" ? guia : idJson) + ".png";
  const hora = new Date().toLocaleTimeString("es-AR", {hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const logId = Date.now();

  const log = document.getElementById("log");
  const item = document.createElement("div");
  item.className = "log-item";
  item.id = "item-" + logId;
  item.innerHTML = `
    <span class="ico" id="ico-${logId}" style="display:inline-block">↻</span>
    <div class="info">
      <div class="nombre">📄 ${nombreFoto}</div>
      <div class="sub" id="sub-${logId}">Guardando...</div>
    </div>
    <div class="ts">${hora}</div>`;
  log.prepend(item);

  const setSub = (txt) => { const el = document.getElementById("sub-"+logId); if(el) el.textContent = txt; };
  const setIco = (ico, color) => {
    const el = document.getElementById("ico-"+logId);
    const it = document.getElementById("item-"+logId);
    if(el) { el.style.animation="none"; el.textContent=ico; }
    if(it && color) it.style.borderLeft = "3px solid " + color;
  };

  try {
    const body = new URLSearchParams();
    body.append(FIELD_GUIA, guia);
    body.append(FIELD_ID_JSON, idJson);
    body.append(FIELD_QR, jsonCompleto);
    body.append(FIELD_MODO, modoUsado);
    await fetch(FORM_URL, {
      method: "POST", mode: "no-cors",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: body.toString()
    });

    contadorOk++;
    document.getElementById("cnt").textContent = contadorOk;
    setIco("✓", "var(--ok)");
    setSub("✓ Guardado · " + (modoUsado === "guia+json" ? "Guía: " + guia : "ID: " + idJson));

  } catch(err) {
    setIco("✗", "var(--err)");
    setSub("Error: " + err.message);
  } finally {
    setTimeout(() => escaneando = false, 700);
  }
}

function abrirManual() { document.getElementById("modal").classList.add("open"); }
function cerrarManual() {
  document.getElementById("modal").classList.remove("open");
  document.getElementById("m-guia").value = "";
  document.getElementById("m-json").value = "";
}
function guardarManual() {
  const guia = document.getElementById("m-guia").value.trim();
  const json  = document.getElementById("m-json").value.trim();
  if (modo === "ambos" && !esGuia(guia)) { alert("Guía inválida (45XXXXXXX)"); return; }
  if (!esJSON(json)) { alert("JSON inválido"); return; }
  const id = extraerID(json);
  if (!id) { alert("No se pudo extraer el ID"); return; }
  cerrarManual();
  procesarCompleto(guia, id, json, modo === "ambos" ? "guia+json" : "solo_json");
}

resetEtapa();
iniciarScanner();
</script>
</body>
</html>
