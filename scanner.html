i <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080c10">
  <title>Scanner Logístico</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scanner">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;900&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg:       #080c10;
      --bg2:      #0e1318;
      --bg3:      #141b22;
      --border:   #1e2d3d;
      --border2:  #2a3d52;
      --accent:   #00d4ff;
      --accent-d: #0099bb;
      --ok:       #00e676;
      --ok-d:     #00b058;
      --err:      #ff4455;
      --warn:     #ffaa00;
      --text:     #e8f0f8;
      --text2:    #8fa8c0;
      --text3:    #4a6278;
      --mono:     'JetBrains Mono', monospace;
      --sans:     'Inter', -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent) 0%, #0066ff 100%);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(0,212,255,0.3);
    }

    .brand-text {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text);
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 9px;
      color: var(--text3);
      font-family: var(--mono);
      letter-spacing: 0.5px;
    }

    .counter-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text2);
    }

    .counter-badge .num {
      color: var(--ok);
      font-weight: 700;
      font-size: 13px;
    }

    /* ── STEPS BAR ── */
    #steps-bar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      flex-shrink: 0;
    }

    .steps-row {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .step-bubble {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid var(--border2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--mono);
      flex-shrink: 0;
      color: var(--text3);
      transition: all 0.35s ease;
    }

    .step-bubble.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,212,255,0.08);
      box-shadow: 0 0 14px rgba(0,212,255,0.25);
    }

    .step-bubble.done {
      border-color: var(--ok);
      background: var(--ok);
      color: #000;
      font-size: 13px;
    }

    .step-text { flex: 1; }

    .step-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text3);
      transition: color 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .step-title.active { color: var(--accent); }
    .step-title.done   { color: var(--ok); }

    .step-desc {
      font-size: 9px;
      color: var(--text3);
      font-family: var(--mono);
      margin-top: 1px;
    }

    .step-line {
      width: 28px;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      flex-shrink: 0;
      margin: 0 4px;
      transition: background 0.4s;
    }

    .step-line.done { background: var(--ok); }

    /* ── TABS ── */
    .tabs {
      display: flex;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .tab {
      flex: 1;
      padding: 10px 8px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text3);
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(0,212,255,0.04);
    }

    /* ── CAMERA ── */
    .camera-section {
      position: relative;
      background: #000;
      flex-shrink: 0;
      overflow: hidden;
    }

    #reader {
      width: 100%;
      height: 100%;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block;
    }

    #reader canvas { display: none !important; }
    #reader img    { display: none !important; }

    /* html5-qrcode internal cleanup */
    #reader > div { border: none !important; }

    /* ── SCAN OVERLAY ── */
    .cam-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* dark mask */
    .cam-overlay::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
    }

    .scan-frame {
      position: relative;
      z-index: 2;
      transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
    }

    .scan-frame.barcode {
      width: 88%;
      height: 72px;
    }

    .scan-frame.qr-mode {
      width: 200px;
      height: 200px;
    }

    /* 4 corner brackets */
    .scan-frame .c { position: absolute; width: 22px; height: 22px; }
    .scan-frame .c::before,
    .scan-frame .c::after { content: ''; position: absolute; background: var(--accent); }

    .scan-frame .c-tl { top: 0; left: 0; }
    .scan-frame .c-tl::before { top: 0; left: 0; width: 100%; height: 3px; border-radius: 3px 0 0 0; }
    .scan-frame .c-tl::after  { top: 0; left: 0; width: 3px; height: 100%; border-radius: 3px 0 0 0; }

    .scan-frame .c-tr { top: 0; right: 0; }
    .scan-frame .c-tr::before { top: 0; right: 0; width: 100%; height: 3px; border-radius: 0 3px 0 0; }
    .scan-frame .c-tr::after  { top: 0; right: 0; width: 3px; height: 100%; border-radius: 0 3px 0 0; }

    .scan-frame .c-bl { bottom: 0; left: 0; }
    .scan-frame .c-bl::before { bottom: 0; left: 0; width: 100%; height: 3px; border-radius: 0 0 0 3px; }
    .scan-frame .c-bl::after  { bottom: 0; left: 0; width: 3px; height: 100%; border-radius: 0 0 0 3px; }

    .scan-frame .c-br { bottom: 0; right: 0; }
    .scan-frame .c-br::before { bottom: 0; right: 0; width: 100%; height: 3px; border-radius: 0 0 3px 0; }
    .scan-frame .c-br::after  { bottom: 0; right: 0; width: 3px; height: 100%; border-radius: 0 0 3px 0; }

    /* Scan beam */
    .scan-beam {
      position: absolute;
      left: 3px; right: 3px;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--accent) 30%, #fff 50%, var(--accent) 70%, transparent 100%);
      border-radius: 2px;
      animation: beamMove 2s ease-in-out infinite;
      box-shadow: 0 0 8px var(--accent);
    }

    .scan-frame.barcode .scan-beam {
      animation: beamMoveShort 1.5s ease-in-out infinite;
    }

    @keyframes beamMove {
      0%   { top: 10%; opacity: 0.6; }
      50%  { top: 85%; opacity: 1; }
      100% { top: 10%; opacity: 0.6; }
    }

    @keyframes beamMoveShort {
      0%   { top: 15%; opacity: 0.7; }
      50%  { top: 75%; opacity: 1; }
      100% { top: 15%; opacity: 0.7; }
    }

    /* Guide chip shown over camera in step 2 */
    .guia-overlay {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,230,118,0.15);
      border: 1px solid var(--ok);
      border-radius: 20px;
      padding: 4px 14px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--ok);
      z-index: 3;
      pointer-events: none;
      white-space: nowrap;
      display: none;
    }

    /* ── STATUS BAR ── */
    .status-bar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 9px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      min-height: 50px;
      transition: border-color 0.3s;
    }

    .status-bar.s-ok   { border-bottom-color: var(--ok); }
    .status-bar.s-err  { border-bottom-color: var(--err); }
    .status-bar.s-warn { border-bottom-color: var(--warn); }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    .status-dot.ok   { background: var(--ok);   box-shadow: 0 0 8px var(--ok);   animation: none; }
    .status-dot.err  { background: var(--err);  box-shadow: 0 0 8px var(--err);  animation: none; }
    .status-dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: none; }
    .status-dot.idle { background: var(--text3); box-shadow: none; animation: none; }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    .status-content { flex: 1; min-width: 0; }

    .status-main {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-hint {
      font-size: 10px;
      color: var(--text2);
      margin-top: 2px;
      font-family: var(--mono);
    }

    /* ── ACTION BUTTONS ── */
    .actions {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .btn-act {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 6px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }

    .btn-act:active {
      transform: scale(0.94);
      background: var(--border);
    }

    .btn-act.reset-btn {
      flex: 0 0 44px;
      font-size: 15px;
      letter-spacing: 0;
      color: var(--text3);
      padding: 9px;
    }

    .btn-act .bico { font-size: 14px; line-height: 1; }

    /* ── LOG ── */
    .log-wrap {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
    }

    .log-empty {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text3);
      padding: 20px;
      text-align: center;
    }

    .log-empty-icon {
      font-size: 38px;
      opacity: 0.25;
    }

    .log-empty-text {
      font-size: 12px;
      font-family: var(--mono);
      line-height: 1.6;
    }

    .log-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      border-left: 3px solid transparent;
      animation: slideIn 0.28s ease;
    }

    .log-item.ok   { border-left-color: var(--ok); }
    .log-item.err  { border-left-color: var(--err); }
    .log-item.sending { border-left-color: var(--accent); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .log-ico { font-size: 18px; flex-shrink: 0; }

    .log-info { flex: 1; min-width: 0; }

    .log-nombre {
      font-size: 12px;
      font-weight: 700;
      font-family: var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .log-sub {
      font-size: 9px;
      color: var(--text2);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--mono);
    }

    .log-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .log-ts {
      font-size: 9px;
      color: var(--text3);
      font-family: var(--mono);
    }

    .btn-edit {
      background: rgba(0,212,255,0.08);
      border: 1px solid rgba(0,212,255,0.25);
      color: var(--accent);
      border-radius: 6px;
      font-size: 9px;
      padding: 2px 8px;
      cursor: pointer;
      font-family: var(--mono);
      font-weight: 600;
      white-space: nowrap;
    }

    /* ── MODAL ── */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal-bg.open { display: flex; }

    .modal-sheet {
      background: var(--bg2);
      width: 100%;
      max-width: 500px;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid var(--border2);
      padding: 16px 16px 36px;
      animation: sheetUp 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: var(--border2);
      border-radius: 2px;
      margin: 0 auto 18px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .modal-desc {
      font-size: 11px;
      color: var(--text2);
      margin-bottom: 16px;
      line-height: 1.6;
      font-family: var(--mono);
    }

    .modal-input {
      width: 100%;
      padding: 13px 14px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      border-radius: 10px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .modal-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
    }

    .modal-btns {
      display: flex;
      gap: 8px;
    }

    .modal-btns button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .modal-btns button:active { transform: scale(0.97); }

    .btn-confirm { background: var(--accent); color: #000; }
    .btn-dismiss { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--bg2);
      border: 1px solid var(--border2);
      border-radius: 30px;
      padding: 9px 18px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--mono);
      z-index: 200;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.35s;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.ok   { border-color: var(--ok);   color: var(--ok); }
    .toast.err  { border-color: var(--err);  color: var(--err); }
    .toast.warn { border-color: var(--warn); color: var(--warn); }

    /* ── FLASH ── */
    .screen-flash {
      position: fixed;
      inset: 0;
      background: rgba(0,212,255,0.12);
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.08s;
    }

    .screen-flash.active { opacity: 1; }

    /* ── SPINNER ── */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spin {
      display: inline-block;
      animation: spin 0.8s linear infinite;
    }

    /* Scrollbar */
    .log-wrap::-webkit-scrollbar { width: 4px; }
    .log-wrap::-webkit-scrollbar-track { background: transparent; }
    .log-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="brand">
    <div class="brand-icon">📦</div>
    <div>
      <div class="brand-text">Scanner</div>
      <div class="brand-sub">Logística · v2.0</div>
    </div>
  </div>
  <div class="counter-badge">
    ✓ <span class="num" id="cnt">0</span> guardados
  </div>
</header>

<!-- STEPS (solo en modo ambos) -->
<div id="steps-bar">
  <div class="steps-row">
    <div class="step-item">
      <div class="step-bubble active" id="sb1">1</div>
      <div class="step-text">
        <div class="step-title active" id="st1">Código de barras</div>
        <div class="step-desc">Guía 45XXXXXXX</div>
      </div>
    </div>
    <div class="step-line" id="sline"></div>
    <div class="step-item">
      <div class="step-bubble" id="sb2">2</div>
      <div class="step-text">
        <div class="step-title" id="st2">Código QR</div>
        <div class="step-desc">JSON del paquete</div>
      </div>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="setMode('ambos', this)">📦 Guía + QR</button>
  <button class="tab" onclick="setMode('solo_json', this)">📱 Solo QR</button>
</div>

<!-- CAMERA -->
<div class="camera-section" id="cam-section">
  <div id="reader"></div>
  <!-- Overlay visual -->
  <div class="cam-overlay">
    <div class="scan-frame barcode" id="scan-frame">
      <div class="c c-tl"></div>
      <div class="c c-tr"></div>
      <div class="c c-bl"></div>
      <div class="c c-br"></div>
      <div class="scan-beam"></div>
    </div>
  </div>
  <!-- Guía capturada chip -->
  <div class="guia-overlay" id="guia-chip"></div>
</div>

<!-- STATUS -->
<div class="status-bar" id="status-bar">
  <div class="status-dot" id="status-dot"></div>
  <div class="status-content">
    <div class="status-main" id="status-main">Iniciando cámara...</div>
    <div class="status-hint" id="status-hint">Apuntá la cámara al código</div>
  </div>
</div>

<!-- ACTIONS -->
<div class="actions">
  <button class="btn-act" onclick="capturarFoto()">
    <span class="bico">📷</span>
    <span id="lbl-foto">Foto</span>
  </button>
  <button class="btn-act" onclick="abrirManual()">
    <span class="bico">⌨️</span>
    <span id="lbl-manual">Manual</span>
  </button>
  <button class="btn-act reset-btn" onclick="confirmarReset()" title="Reiniciar">↺</button>
</div>

<!-- LOG -->
<div class="log-wrap" id="log">
  <div class="log-empty" id="log-empty">
    <div class="log-empty-icon">📋</div>
    <div class="log-empty-text">
      Aquí aparecen los<br>escaneos guardados
    </div>
  </div>
</div>

<!-- FILE INPUT -->
<input type="file" id="file-foto" accept="image/*" capture="environment"
  style="display:none" onchange="procesarFoto(event)">

<!-- MODAL -->
<div class="modal-bg" id="modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Ingresar guía</div>
    <div class="modal-desc" id="modal-desc">Escribí el número de 9 dígitos que empieza con 45</div>
    <input class="modal-input" id="modal-input"
      placeholder="455136087" inputmode="numeric" maxlength="9" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-dismiss" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-confirm" onclick="confirmarModal()">Guardar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- FLASH -->
<div class="screen-flash" id="flash"></div>

<script>
/* ═══════════════════════════════════════════════
   CONFIG — ajustá estas constantes si es necesario
   ═══════════════════════════════════════════════ */
const FORM_URL    = "https://docs.google.com/forms/d/e/1FAIpQLSevZQcgCF9SXA8vYTR1kij0E-yuFyZCrNG9HQs48sjQE3TX7w/formResponse";
const FIELD_GUIA  = "entry.773642673";
const FIELD_ID    = "entry.1128661543";
const FIELD_QR    = "entry.1584746756";
const FIELD_MODO  = "entry.1737704567";

/* ═══════════════════════════════════════════════
   ESTADO
   ═══════════════════════════════════════════════ */
let modo         = "ambos";   // "ambos" | "solo_json"
let etapa        = "guia";    // "guia"  | "json"
let guiaActual   = "";
let contadorOk   = 0;
let escaneando   = false;
let lastTxt      = "";
let lastTs       = 0;
let nativo       = false;     // usa BarcodeDetector nativo
let detector     = null;
let stream       = null;
let rafId        = null;
let h5scanner    = null;
let logSeq       = 0;

/* ═══════════════════════════════════════════════
   VALIDACIONES
   ═══════════════════════════════════════════════ */
function esGuia(txt) {
  return /^45\d{7}$/.test(txt.trim());
}

function parsearQR(txt) {
  try {
    // Normalizar: single quotes → double quotes
    let s = txt.trim().replace(/'/g, '"');
    // A veces viene sin llaves externas, intentar agregar
    if (!s.startsWith('{')) s = '{' + s + '}';
    const obj = JSON.parse(s);
    const ok = obj.id && obj.sender_id && obj.hash_code && obj.security_digit;
    if (ok) return { valido: true, id: String(obj.id), obj };
  } catch {}
  return { valido: false };
}

/* ═══════════════════════════════════════════════
   FEEDBACK
   ═══════════════════════════════════════════════ */
let toastTimer;
function toast(msg, tipo = "ok") {
  const el = document.getElementById("toast");
  clearTimeout(toastTimer);
  el.className = "toast visible " + tipo;
  el.textContent = (tipo === "ok" ? "✓  " : tipo === "err" ? "✗  " : "⚠  ") + msg;
  toastTimer = setTimeout(() => el.classList.remove("visible"), 2800);
}

function flashScreen() {
  const f = document.getElementById("flash");
  f.classList.add("active");
  setTimeout(() => f.classList.remove("active"), 160);
}

function vibrar(p) {
  try { if (navigator.vibrate) navigator.vibrate(p); } catch {}
}

/* ═══════════════════════════════════════════════
   UI — STATUS
   ═══════════════════════════════════════════════ */
const DOT_STATES = {
  scan: "",      // pulso azul (default)
  ok:   "ok",
  err:  "err",
  warn: "warn",
  idle: "idle",
};

function setStatus(dot, main, hint) {
  document.getElementById("status-dot").className = "status-dot " + (DOT_STATES[dot] ?? "");
  document.getElementById("status-main").textContent = main;
  document.getElementById("status-hint").textContent = hint || "";

  const bar = document.getElementById("status-bar");
  bar.className = "status-bar" + (dot === "ok" ? " s-ok" : dot === "err" ? " s-err" : dot === "warn" ? " s-warn" : "");
}

function refrescarStatus() {
  if (modo === "ambos") {
    if (etapa === "guia") {
      setStatus("scan",
        "Buscando guía de envío…",
        "Apuntá la cámara al código de barras 45XXXXXXX");
    } else {
      setStatus("warn",
        "✓ Guía " + guiaActual + " — ahora escaneá el QR",
        "Apuntá al código QR cuadrado del paquete");
    }
  } else {
    setStatus("scan",
      "Buscando código QR…",
      "Apuntá la cámara al código QR del paquete");
  }
}

/* ═══════════════════════════════════════════════
   UI — STEPS
   ═══════════════════════════════════════════════ */
function refrescarSteps() {
  const bar = document.getElementById("steps-bar");
  if (modo === "solo_json") { bar.style.display = "none"; return; }
  bar.style.display = "block";

  const sb1 = document.getElementById("sb1"), st1 = document.getElementById("st1");
  const sb2 = document.getElementById("sb2"), st2 = document.getElementById("st2");
  const sl  = document.getElementById("sline");

  if (etapa === "guia") {
    sb1.className = "step-bubble active"; st1.className = "step-title active"; sb1.textContent = "1";
    sb2.className = "step-bubble";        st2.className = "step-title";
    sl.className  = "step-line";
  } else {
    sb1.className = "step-bubble done";   st1.className = "step-title done";   sb1.textContent = "✓";
    sb2.className = "step-bubble active"; st2.className = "step-title active";
    sl.className  = "step-line done";
  }
}

/* ═══════════════════════════════════════════════
   UI — SCAN FRAME & GUIA CHIP
   ═══════════════════════════════════════════════ */
function refrescarFrame() {
  const frame = document.getElementById("scan-frame");
  const chip  = document.getElementById("guia-chip");

  if (modo === "ambos" && etapa === "guia") {
    frame.className = "scan-frame barcode";
    chip.style.display = "none";
  } else {
    frame.className = "scan-frame qr-mode";
    if (guiaActual) {
      chip.textContent = "📦 " + guiaActual;
      chip.style.display = "block";
    } else {
      chip.style.display = "none";
    }
  }
}

/* ═══════════════════════════════════════════════
   UI — BUTTONS
   ═══════════════════════════════════════════════ */
function refrescarBotones() {
  const isBarcode = modo === "ambos" && etapa === "guia";
  document.getElementById("lbl-foto").textContent   = isBarcode ? "Foto guía"  : "Foto QR";
  document.getElementById("lbl-manual").textContent = isBarcode ? "Guía manual" : "QR manual";
}

/* ═══════════════════════════════════════════════
   CÁMARA — altura dinámica
   ═══════════════════════════════════════════════ */
function ajustarCamara() {
  const vh = window.innerHeight;
  const h  = Math.min(Math.max(Math.floor(vh * 0.36), 180), 300);
  document.getElementById("cam-section").style.height = h + "px";
}

/* ═══════════════════════════════════════════════
   SCANNER — BarcodeDetector nativo (Android Chrome)
   ═══════════════════════════════════════════════ */
async function soportaNativo() {
  if (!("BarcodeDetector" in window)) return false;
  try {
    const fmts = await BarcodeDetector.getSupportedFormats();
    return fmts.includes("qr_code") || fmts.includes("code_128");
  } catch { return false; }
}

async function iniciarNativo() {
  await detener();
  nativo = true;

  const reader = document.getElementById("reader");
  reader.innerHTML = "";

  const video = document.createElement("video");
  video.setAttribute("playsinline", "");
  video.style.cssText = "width:100%;height:100%;object-fit:cover;display:block;";
  reader.appendChild(video);

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment",
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    // Construir detector con todos los formatos posibles
    const disponibles = await BarcodeDetector.getSupportedFormats();
    const quiero = ["code_128","code_39","ean_13","ean_8","itf","codabar","data_matrix","qr_code","pdf417"];
    const usar   = quiero.filter(f => disponibles.includes(f));
    detector = new BarcodeDetector({ formats: usar.length ? usar : ["code_128","qr_code"] });

    const canvas = document.createElement("canvas");
    const ctx    = canvas.getContext("2d");

    const tick = async () => {
      if (!escaneando && video.readyState >= video.HAVE_CURRENT_DATA) {
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        try {
          const codes = await detector.detect(canvas);
          if (codes.length) {
            // Seleccionar el código más relevante para la etapa actual
            let best = codes[0];
            if (modo === "ambos" && etapa === "guia") {
              // Preferir código lineal sobre QR
              const lineal = codes.find(c => c.format !== "qr_code" && c.format !== "data_matrix");
              if (lineal) best = lineal;
            } else {
              // Preferir QR
              const qr = codes.find(c => c.format === "qr_code" || c.format === "data_matrix");
              if (qr) best = qr;
            }
            onScan(best.rawValue);
          }
        } catch {}
      }
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);

  } catch(e) {
    setStatus("err", "Sin acceso a la cámara", "Verificá los permisos en el navegador");
  }
}

/* ═══════════════════════════════════════════════
   SCANNER — html5-qrcode (fallback)
   ═══════════════════════════════════════════════ */
async function iniciarH5() {
  await detener();
  nativo = false;
  h5scanner = new Html5Qrcode("reader");

  // Calcular qrbox según etapa
  const camW = document.getElementById("cam-section").clientWidth || 360;
  const camH = parseInt(document.getElementById("cam-section").style.height) || 230;

  let qrbox;
  if (modo === "ambos" && etapa === "guia") {
    // Código de barras: muy ancho y angosto
    qrbox = { width: Math.floor(camW * 0.92), height: 85 };
  } else {
    // QR: cuadrado
    const side = Math.min(Math.floor(camH * 0.78), Math.floor(camW * 0.75), 240);
    qrbox = { width: side, height: side };
  }

  const config = {
    fps: 20,
    qrbox,
    videoConstraints: {
      facingMode: "environment",
      width:  { ideal: 1280 },
      height: { ideal: 720 }
    },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.DATA_MATRIX,
    ],
    rememberLastUsedCamera: false,
    showTorchButtonIfSupported: false,
  };

  // Suprimir UI propia de html5-qrcode
  const style = document.createElement("style");
  style.id = "h5-hide";
  style.textContent = `
    #reader__scan_region { display:block !important; }
    #reader__scan_region img { display:none !important; }
    #reader__dashboard { display:none !important; }
    #reader__header_message { display:none !important; }
    #reader video { width:100%!important; height:100%!important; object-fit:cover!important; }
  `;
  if (!document.getElementById("h5-hide")) document.head.appendChild(style);

  try {
    await h5scanner.start({ facingMode: "environment" }, config, onScan, () => {});
  } catch {
    try {
      const cams = await Html5Qrcode.getCameras();
      if (cams?.length) {
        await h5scanner.start(cams[cams.length - 1].id, config, onScan, () => {});
      } else {
        setStatus("err", "No se encontró cámara", "Usá los botones de ingreso manual");
      }
    } catch {
      setStatus("err", "Sin acceso a la cámara", "Verificá los permisos en el navegador");
    }
  }
}

/* ═══════════════════════════════════════════════
   DETENER todo
   ═══════════════════════════════════════════════ */
async function detener() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (h5scanner) {
    try { await h5scanner.stop(); } catch {}
    h5scanner = null;
  }
  document.getElementById("reader").innerHTML = "";
}

/* ═══════════════════════════════════════════════
   PROCESAR ESCANEO
   ═══════════════════════════════════════════════ */
function onScan(txt) {
  if (escaneando) return;
  txt = txt.trim();
  const ahora = Date.now();
  // Debounce: mismo texto en menos de 2 seg → ignorar
  if (txt === lastTxt && ahora - lastTs < 2000) return;
  lastTxt = txt;
  lastTs  = ahora;

  if (modo === "ambos") {

    if (etapa === "guia") {
      if (esGuia(txt)) {
        // ✓ Guía capturada
        guiaActual = txt;
        etapa = "json";
        flashScreen();
        vibrar(80);
        toast("Guía " + guiaActual + " capturada ✓", "ok");
        actualizarUI();
        // Reiniciar scanner en modo QR
        if (!nativo) setTimeout(() => iniciarH5(), 100);

      } else if (parsearQR(txt).valido) {
        setStatus("warn",
          "Primero necesitás la guía",
          "Escaneá el código de barras 45XXXXXXX antes del QR");
        vibrar([150, 50, 150]);
        setTimeout(refrescarStatus, 2500);

      } else {
        setStatus("err",
          "Código no reconocido",
          "Buscá el código de barras que empieza con 45");
        vibrar([100, 60, 100]);
        setTimeout(refrescarStatus, 2200);
      }

    } else { // etapa === "json"

      const v = parsearQR(txt);
      if (v.valido) {
        // ✓ QR capturado — guardar
        flashScreen();
        vibrar([60, 40, 80]);
        guardar(guiaActual, v.id, txt, "guia+json");
        resetearEtapa();

      } else if (esGuia(txt)) {
        // Nueva guía escaneada mientras esperaba QR → actualizar
        guiaActual = txt;
        toast("Guía actualizada: " + guiaActual, "warn");
        actualizarUI();

      } else {
        setStatus("err",
          "QR inválido",
          "Necesita los campos: id, sender_id, hash_code, security_digit");
        vibrar([100, 60, 100]);
        setTimeout(refrescarStatus, 2500);
      }
    }

  } else { // solo_json
    const v = parsearQR(txt);
    if (v.valido) {
      flashScreen();
      vibrar([60, 40, 80]);
      guardar("", v.id, txt, "solo_json");
    } else {
      setStatus("err",
        "QR inválido",
        "El QR no tiene el formato correcto");
      vibrar([100, 60, 100]);
      setTimeout(refrescarStatus, 2500);
    }
  }
}

/* ═══════════════════════════════════════════════
   GUARDAR EN GOOGLE FORMS
   ═══════════════════════════════════════════════ */
async function guardar(guia, idJson, jsonCompleto, modoUsado) {
  escaneando = true;
  logSeq++;
  const id   = "li" + logSeq;
  const hora = new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const lab  = modoUsado === "guia+json" ? "GU­ÍA " + guia : "ID " + idJson;

  // Ocultar empty state
  document.getElementById("log-empty").style.display = "none";

  // Agregar item al log
  const log  = document.getElementById("log");
  const item = document.createElement("div");
  item.className = "log-item sending";
  item.id = id;
  item.innerHTML = `
    <div class="log-ico" id="${id}-ico"><span class="spin">⟳</span></div>
    <div class="log-info">
      <div class="log-nombre">📦 ${lab}</div>
      <div class="log-sub" id="${id}-sub">Guardando en servidor...</div>
    </div>
    <div class="log-right">
      <div class="log-ts">${hora}</div>
      <button class="btn-edit"
        onclick="editarItem('${id}','${guia.replace(/'/g,"\\'")}','${idJson}','${modoUsado}')">
        ✏️ Editar
      </button>
    </div>
  `;
  log.prepend(item);

  const setSub = t => { const e = document.getElementById(id + "-sub"); if (e) e.textContent = t; };
  const setIco = t => { const e = document.getElementById(id + "-ico"); if (e) e.innerHTML = t; };
  const setItemClass = c => { item.className = "log-item " + c; };

  try {
    const body = new URLSearchParams();
    body.append(FIELD_GUIA, guia);
    body.append(FIELD_ID,   idJson);
    body.append(FIELD_QR,   jsonCompleto);
    body.append(FIELD_MODO, modoUsado);

    await fetch(FORM_URL, {
      method:  "POST",
      mode:    "no-cors",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body:    body.toString()
    });

    contadorOk++;
    document.getElementById("cnt").textContent = contadorOk;
    setIco("✅");
    setSub("✓ Guardado correctamente");
    setItemClass("log-item ok");
    toast("Guardado exitosamente", "ok");

  } catch(err) {
    setIco("❌");
    setSub("Error al guardar — tocá ✏️ para reintentar");
    setItemClass("log-item err");
    toast("Error de conexión", "err");
  } finally {
    setTimeout(() => { escaneando = false; }, 900);
  }
}

/* ═══════════════════════════════════════════════
   EDITAR ENTRADA DEL LOG
   ═══════════════════════════════════════════════ */
function editarItem(logId, guiaOrig, idOrig, modoOrig) {
  const campo  = modoOrig === "guia+json" ? "guía" : "ID del QR";
  const actual = modoOrig === "guia+json" ? guiaOrig : idOrig;
  const nuevo  = prompt("Corregí el " + campo + ":", actual);
  if (!nuevo?.trim()) return;
  const v = nuevo.trim();

  const item = document.getElementById(logId);
  if (item) {
    item.querySelector(".log-nombre").textContent = "📦 " + v + " (corregido)";
    item.querySelector("#" + logId + "-sub").textContent = "Reenviando...";
    item.querySelector("#" + logId + "-ico").innerHTML = '<span class="spin">⟳</span>';
    item.className = "log-item sending";
  }

  if (modoOrig === "guia+json") {
    guardar(v, idOrig, "", modoOrig);
  } else {
    guardar("", v, "", modoOrig);
  }
}

/* ═══════════════════════════════════════════════
   CAMBIAR MODO
   ═══════════════════════════════════════════════ */
async function setMode(m, el) {
  modo = m;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  await resetearEtapa();
}

/* ═══════════════════════════════════════════════
   RESETEAR ETAPA
   ═══════════════════════════════════════════════ */
async function resetearEtapa() {
  escaneando  = false;
  lastTxt     = "";
  guiaActual  = "";
  etapa       = modo === "ambos" ? "guia" : "json";

  actualizarUI();

  if (!nativo) {
    await iniciarH5();
  }
}

function confirmarReset() {
  if (guiaActual || etapa === "json") {
    if (!confirm("¿Reiniciar el escaneo actual?")) return;
  }
  resetearEtapa();
}

function actualizarUI() {
  refrescarSteps();
  refrescarStatus();
  refrescarFrame();
  refrescarBotones();
}

/* ═══════════════════════════════════════════════
   MODAL MANUAL
   ═══════════════════════════════════════════════ */
function abrirManual() {
  const esBarcode = modo === "ambos" && etapa === "guia";
  document.getElementById("modal-title").textContent = esBarcode ? "Ingresar número de guía" : "Ingresar código QR";
  document.getElementById("modal-desc").textContent  = esBarcode
    ? "Escribí el número de 9 dígitos que empieza con 45 — por ejemplo: 455136087"
    : "Pegá el contenido completo del QR en formato JSON";
  const inp = document.getElementById("modal-input");
  inp.value       = "";
  inp.placeholder = esBarcode ? "455136087" : "{'id':'...','sender_id':...}";
  inp.inputMode   = esBarcode ? "numeric" : "text";
  inp.maxLength   = esBarcode ? 9 : 524288;
  document.getElementById("modal").classList.add("open");
  setTimeout(() => inp.focus(), 200);
}

function cerrarModal() {
  document.getElementById("modal").classList.remove("open");
  document.getElementById("modal-input").value = "";
}

function confirmarModal() {
  const valor = document.getElementById("modal-input").value.trim();
  const esBarcode = modo === "ambos" && etapa === "guia";

  if (esBarcode) {
    if (!esGuia(valor)) {
      toast("Guía inválida — debe tener 9 dígitos y empezar con 45", "err");
      return;
    }
    guiaActual = valor;
    etapa      = "json";
    cerrarModal();
    vibrar(80);
    toast("Guía " + valor + " ingresada ✓", "ok");
    actualizarUI();
    if (!nativo) setTimeout(() => iniciarH5(), 100);

  } else {
    const v = parsearQR(valor);
    if (!v.valido) {
      toast("QR inválido — debe tener id, sender_id, hash_code, security_digit", "err");
      return;
    }
    cerrarModal();
    const guiaUsar = modo === "ambos" ? guiaActual : "";
    const modoUsado = modo === "ambos" ? "guia+json" : "solo_json";
    guardar(guiaUsar, v.id, valor, modoUsado);
    if (modo === "ambos") resetearEtapa();
  }
}

/* ═══════════════════════════════════════════════
   CAPTURA POR FOTO
   ═══════════════════════════════════════════════ */
function capturarFoto() {
  // Reset para permitir seleccionar la misma imagen dos veces
  const inp = document.getElementById("file-foto");
  inp.value = "";
  inp.click();
}

async function procesarFoto(event) {
  const file = event.target.files[0];
  if (!file) return;

  toast("Analizando imagen...", "warn");

  // Intento 1: BarcodeDetector nativo
  if (nativo && detector) {
    try {
      const img = new Image();
      img.src   = URL.createObjectURL(file);
      await img.decode();
      const canvas = document.createElement("canvas");
      canvas.width  = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext("2d").drawImage(img, 0, 0);
      URL.revokeObjectURL(img.src);
      const codes = await detector.detect(canvas);
      if (codes.length) {
        // Seleccionar el más relevante
        let best = codes[0];
        if (modo === "ambos" && etapa === "guia") {
          const lin = codes.find(c => c.format !== "qr_code");
          if (lin) best = lin;
        }
        onScan(best.rawValue);
        return;
      }
    } catch {}
  }

  // Intento 2: html5-qrcode escaneo de archivo
  const divTemp = document.createElement("div");
  divTemp.id    = "reader-tmp";
  divTemp.style.display = "none";
  document.body.appendChild(divTemp);
  const tmp = new Html5Qrcode("reader-tmp");
  try {
    const txt = await tmp.scanFile(file, true);
    onScan(txt);
  } catch {
    toast("No se detectó ningún código en la foto", "err");
  } finally {
    try { tmp.clear(); } catch {}
    document.body.removeChild(divTemp);
  }
}

/* ═══════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════ */
(async () => {
  ajustarCamara();
  window.addEventListener("resize", ajustarCamara);

  // Enter en modal
  document.getElementById("modal-input").addEventListener("keydown", e => {
    if (e.key === "Enter") confirmarModal();
  });

  // Cerrar modal al tocar fondo
  document.getElementById("modal").addEventListener("click", e => {
    if (e.target.id === "modal") cerrarModal();
  });

  actualizarUI();

  // Detectar soporte y arrancar
  if (await soportaNativo()) {
    await iniciarNativo();
  } else {
    await iniciarH5();
  }
})();
</script>

<!-- Registro del Service Worker (PWA offline) -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('✓ Scanner PWA lista'))
        .catch(e => console.warn('SW error:', e));
    });
  }
</script>

</body>
</html>
