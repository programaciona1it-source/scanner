<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Scanner QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.21.3/zxing.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--surface:#181818;--accent:#00e5ff;--accent2:#ff4b6e;
  --text:#f0f0f0;--muted:#666;--ok:#00e676;--err:#ff4b6e;--warn:#ffb300;
}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222;flex-shrink:0}
header h1{font-size:14px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
#counter{font-size:11px;color:var(--muted);background:#1e1e1e;padding:3px 10px;border-radius:20px}
#counter span{color:var(--ok);font-weight:bold}

.tabs{display:flex;border-bottom:1px solid #222;flex-shrink:0}
.tab{flex:1;padding:11px;text-align:center;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

main{flex:1;display:flex;flex-direction:column;overflow:hidden}

.cam-wrap{position:relative;width:100%;aspect-ratio:1/1;max-height:50dvh;background:#000;overflow:hidden;flex-shrink:0}
#video{width:100%;height:100%;object-fit:cover;display:block}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.viewfinder{width:60%;aspect-ratio:1;border:2px solid var(--accent);border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.5);position:relative}
.viewfinder::before,.viewfinder::after,.viewfinder .c2::before,.viewfinder .c2::after{content:'';position:absolute;width:20px;height:20px;border-color:var(--accent);border-style:solid}
.viewfinder::before{top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:10px 0 0 0}
.viewfinder::after{top:-2px;right:-2px;border-width:3px 3px 0 0;border-radius:0 10px 0 0}
.viewfinder .c2::before{bottom:-2px;left:-2px;border-width:0 0 3px 3px;border-radius:0 0 0 10px}
.viewfinder .c2::after{bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 10px 0}
.scan-line{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:scan 1.8s ease-in-out infinite;top:0}
@keyframes scan{0%,100%{top:10%;opacity:.8}50%{top:88%;opacity:1}}

/* etiqueta de modo sobre la camara */
.cam-label{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:var(--warn);font-size:11px;letter-spacing:1px;padding:4px 12px;border-radius:20px;text-transform:uppercase;white-space:nowrap}

.flash-ok{position:absolute;inset:0;background:rgba(0,230,118,.25);opacity:0;pointer-events:none;transition:opacity .1s}
.flash-ok.show{opacity:1}

.state-bar{padding:9px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #1a1a1a;flex-shrink:0;min-height:44px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
.dot.esperando{background:var(--accent);box-shadow:0 0 6px var(--accent);animation:pulse 1s infinite}
.dot.ok{background:var(--ok);box-shadow:0 0 6px var(--ok);animation:none}
.dot.err{background:var(--err);animation:none}
.dot.warn{background:var(--warn);box-shadow:0 0 6px var(--warn);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#estado-texto{font-size:12px;color:var(--text);letter-spacing:.5px;flex:1}

.preview-bar{padding:6px 16px;font-size:9px;color:#444;word-break:break-all;border-bottom:1px solid #111;min-height:30px;flex-shrink:0}

.log-wrap{flex:1;overflow-y:auto;padding:4px 0}
.log-item{display:flex;align-items:flex-start;gap:10px;padding:7px 14px;border-bottom:1px solid #111;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.log-item .ico{font-size:13px;flex-shrink:0;padding-top:1px}
.log-item .info{flex:1;min-width:0}
.log-item .nombre{font-size:12px;color:var(--text);font-weight:bold}
.log-item .sub{font-size:9px;color:var(--muted);margin-top:2px}
.log-item .ts{font-size:9px;color:#333;flex-shrink:0;align-self:center}

.btn-manual{margin:6px 14px;padding:9px;background:#1e1e1e;border:1px solid #2a2a2a;color:var(--muted);font-family:inherit;font-size:10px;border-radius:8px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;width:calc(100% - 28px)}
.btn-manual:active{background:#2a2a2a}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-bg.open{display:flex}
.modal{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:22px 18px 30px}
.modal h3{font-size:12px;color:var(--accent);letter-spacing:2px;margin-bottom:14px;text-transform:uppercase}
.modal input{width:100%;padding:11px;background:#111;border:1px solid #333;color:var(--text);font-family:inherit;font-size:12px;border-radius:8px;margin-bottom:8px}
.modal input:focus{outline:none;border-color:var(--accent)}
.modal-btns{display:flex;gap:8px;margin-top:4px}
.modal-btns button{flex:1;padding:11px;border:none;border-radius:8px;font-family:inherit;font-size:11px;cursor:pointer;letter-spacing:1px}
.btn-ok{background:var(--accent);color:#000;font-weight:bold}
.btn-cancel{background:#2a2a2a;color:var(--muted)}
</style>
</head>
<body>

<header>
  <h1>⚡ Scanner</h1>
  <div id="counter">Guardados: <span id="cnt">0</span></div>
</header>

<div class="tabs">
  <button class="tab active" onclick="setMode('ambos',this)">Guía + JSON</button>
  <button class="tab" onclick="setMode('solo_json',this)">Solo JSON</button>
</div>

<main>
  <div class="cam-wrap">
    <video id="video" playsinline autoplay muted></video>
    <div class="overlay">
      <div class="viewfinder"><div class="c2"></div><div class="scan-line"></div></div>
    </div>
    <div class="cam-label" id="cam-label">Escaneá la GUÍA</div>
    <div class="flash-ok" id="flash"></div>
  </div>

  <div class="state-bar">
    <div class="dot esperando" id="dot"></div>
    <div id="estado-texto">Esperando guía...</div>
  </div>

  <div class="preview-bar" id="preview">—</div>

  <button class="btn-manual" onclick="abrirManual()">✏ Entrada manual</button>

  <div class="log-wrap" id="log"></div>
</main>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>Entrada Manual</h3>
    <input id="m-guia" placeholder="Guía (45XXXXXXX) — dejar vacío si es solo JSON" maxlength="9" inputmode="numeric">
    <input id="m-json" placeholder="JSON completo" style="font-size:10px">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="cerrarManual()">Cancelar</button>
      <button class="btn-ok" onclick="guardarManual()">Guardar</button>
    </div>
  </div>
</div>

<script>
// ============ CONFIG ============
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSevZQcgCF9SXA8vYTR1kij0E-yuFyZCrNG9HQs48sjQE3TX7w/formResponse";
const FIELD_GUIA    = "entry.773642673";
const FIELD_ID_JSON = "entry.1128661543";
const FIELD_QR      = "entry.1584746756";
const FIELD_MODO    = "entry.1737704567";
// ================================

let modo = "ambos";
let etapa = "guia";
let guiaActual = "";
let contadorOk = 0;
let escaneando = false;
let ultimoTexto = "";
let ultimoTs = 0;

// ---- Extraer id del JSON ----
function extraerID(txt) {
  // Soporta tanto comillas simples como dobles
  const m = txt.match(/['"]id['"]\s*:\s*['"](\d+)['"]/);
  return m ? m[1] : null;
}

function esGuia(txt) {
  return /^45\d{7}$/.test(txt.trim());
}

function esJSON(txt) {
  const t = txt.trim();
  return (t.includes("id") && t.includes("hash_code") && t.includes("sender_id"));
}

// ---- Modo ----
function setMode(m, el) {
  modo = m;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  resetEtapa();
}

function resetEtapa() {
  escaneando = false;
  ultimoTexto = "";
  if (modo === "ambos") {
    etapa = "guia";
    guiaActual = "";
    setEstado("esperando", "Escaneá la guía (45XXXXXXX)");
    setCamLabel("Escaneá la GUÍA");
  } else {
    etapa = "json";
    setEstado("esperando", "Escaneá el JSON");
    setCamLabel("Escaneá el JSON");
  }
  document.getElementById("preview").textContent = "—";
}

function setEstado(tipo, txt) {
  document.getElementById("dot").className = "dot " + tipo;
  document.getElementById("estado-texto").textContent = txt;
}

function setCamLabel(txt) {
  document.getElementById("cam-label").textContent = txt;
}

// ---- Scanner ----
async function iniciarScanner() {
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.QR_CODE,
    ZXing.BarcodeFormat.CODE_128,
    ZXing.BarcodeFormat.CODE_39,
    ZXing.BarcodeFormat.EAN_13,
    ZXing.BarcodeFormat.DATA_MATRIX,
    ZXing.BarcodeFormat.PDF_417,
    ZXing.BarcodeFormat.AZTEC,
  ]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

  const reader = new ZXing.BrowserMultiFormatReader(hints, 300);
  const devices = await ZXing.BrowserCodeReader.listVideoInputDevices();
  const device = devices.find(d => /back|rear|environment/i.test(d.label)) || devices[devices.length - 1];

  reader.decodeFromVideoDevice(device?.deviceId, "video", (result) => {
    if (!result || escaneando) return;
    const txt = result.getText().trim();
    const ahora = Date.now();
    if (txt === ultimoTexto && ahora - ultimoTs < 2000) return;
    ultimoTexto = txt;
    ultimoTs = ahora;
    procesarScan(txt);
  });
}

function procesarScan(txt) {
  document.getElementById("preview").textContent = txt.length > 90 ? txt.slice(0,90)+"…" : txt;

  if (modo === "ambos") {
    if (etapa === "guia") {
      if (esGuia(txt)) {
        guiaActual = txt;
        etapa = "json";
        flashOk(); vibrar(50);
        setEstado("warn", "✓ Guía " + txt + " — escaneá el JSON");
        setCamLabel("Escaneá el JSON");
      } else {
        setEstado("err", "✗ Guía inválida — debe ser 45XXXXXXX");
        vibrar(200);
        setTimeout(() => setEstado("esperando", "Escaneá la guía (45XXXXXXX)"), 1500);
      }
    } else {
      // etapa json
      if (esJSON(txt)) {
        const idJson = extraerID(txt);
        if (!idJson) {
          setEstado("err", "✗ No se pudo extraer el ID del JSON");
          vibrar(200);
          setTimeout(() => setEstado("warn", "✓ Guía " + guiaActual + " — escaneá el JSON"), 1500);
          return;
        }
        flashOk(); vibrar([50,30,50]);
        enviar(guiaActual, idJson, txt, "guia+json");
        resetEtapa();
      } else if (esGuia(txt)) {
        // nueva guía antes del json → la reemplaza
        guiaActual = txt;
        flashOk(); vibrar(50);
        setEstado("warn", "✓ Guía " + txt + " — escaneá el JSON");
      } else {
        setEstado("err", "✗ No es un JSON válido");
        vibrar(200);
        setTimeout(() => setEstado("warn", "✓ Guía " + guiaActual + " — escaneá el JSON"), 1500);
      }
    }
  } else {
    // solo json
    if (esJSON(txt)) {
      const idJson = extraerID(txt);
      if (!idJson) {
        setEstado("err", "✗ No se pudo extraer el ID del JSON");
        vibrar(200);
        setTimeout(() => setEstado("esperando", "Escaneá el JSON"), 1500);
        return;
      }
      flashOk(); vibrar([50,30,50]);
      enviar("", idJson, txt, "solo_json");
    } else {
      setEstado("err", "✗ No es un JSON válido");
      vibrar(200);
      setTimeout(() => setEstado("esperando", "Escaneá el JSON"), 1500);
    }
  }
}

function flashOk() {
  const f = document.getElementById("flash");
  f.classList.add("show");
  setTimeout(() => f.classList.remove("show"), 180);
}
function vibrar(p) { if (navigator.vibrate) navigator.vibrate(p); }

// ---- Envío a Google Form ----
function enviar(guia, idJson, jsonCompleto, modoUsado) {
  escaneando = true;

  // Nombre final del archivo PNG
  const nombreFoto = (modoUsado === "ambos" ? guia : idJson) + ".png";

  const id = Date.now();
  const hora = new Date().toLocaleTimeString("es-AR", {hour:"2-digit",minute:"2-digit",second:"2-digit"});

  const log = document.getElementById("log");
  const item = document.createElement("div");
  item.className = "log-item";
  item.id = "item-" + id;
  item.innerHTML = `
    <span class="ico" style="animation:spin .8s linear infinite;display:inline-block">↻</span>
    <div class="info">
      <div class="nombre">📄 ${nombreFoto}</div>
      <div class="sub">ID: ${idJson}${guia ? " · Guía: " + guia : ""}</div>
    </div>
    <div class="ts">${hora}</div>
  `;
  log.prepend(item);

  // Armar form data para Google Forms
  const body = new URLSearchParams();
  body.append(FIELD_GUIA, guia);
  body.append(FIELD_ID_JSON, idJson);
  body.append(FIELD_QR, jsonCompleto);
  body.append(FIELD_MODO, modoUsado);

  fetch(FORM_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: body.toString()
  })
  .then(() => {
    contadorOk++;
    document.getElementById("cnt").textContent = contadorOk;
    const el = document.getElementById("item-" + id);
    if (el) {
      el.querySelector(".ico").style.animation = "none";
      el.querySelector(".ico").textContent = "✓";
      el.style.borderLeft = "3px solid var(--ok)";
    }
  })
  .catch(() => {
    const el = document.getElementById("item-" + id);
    if (el) {
      el.querySelector(".ico").style.animation = "none";
      el.querySelector(".ico").textContent = "✗";
      el.style.borderLeft = "3px solid var(--err)";
      el.querySelector(".sub").textContent = "⚠ Error al enviar";
    }
  })
  .finally(() => {
    setTimeout(() => escaneando = false, 700);
  });
}

// ---- Manual ----
function abrirManual() { document.getElementById("modal").classList.add("open"); }
function cerrarManual() {
  document.getElementById("modal").classList.remove("open");
  document.getElementById("m-guia").value = "";
  document.getElementById("m-json").value = "";
}
function guardarManual() {
  const guia = document.getElementById("m-guia").value.trim();
  const json  = document.getElementById("m-json").value.trim();
  if (modo === "ambos" && !esGuia(guia)) { alert("Guía inválida (45XXXXXXX)"); return; }
  if (!esJSON(json)) { alert("JSON inválido"); return; }
  const idJson = extraerID(json);
  if (!idJson) { alert("No se pudo extraer el ID del JSON"); return; }
  cerrarManual();
  enviar(guia, idJson, json, modo === "ambos" ? "guia+json" : "solo_json");
}

resetEtapa();
iniciarScanner();
</script>
</body>
</html>
