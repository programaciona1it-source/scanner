<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Scanner QR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js">
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #0d0d0d;
      --accent: #00e5ff;
      --ok: #00e676;
      --err: #ff4b6e;
      --warn: #ffb300;
      --text: #f0f0f0;
      --muted: #666
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222;
      flex-shrink: 0
    }

    header h1 {
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase
    }

    #counter {
      font-size: 11px;
      color: var(--muted);
      background: #1e1e1e;
      padding: 3px 10px;
      border-radius: 20px
    }

    #counter span {
      color: var(--ok);
      font-weight: bold
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #222;
      flex-shrink: 0
    }

    .tab {
      flex: 1;
      padding: 11px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
      font-family: inherit
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent)
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    #reader {
      width: 100%;
      max-height: 50dvh;
      flex-shrink: 0;
      background: #000;
      position: relative
    }

    #reader video,
    #reader canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover
    }

    #reader img {
      display: none
    }

    .state-bar {
      padding: 9px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
      min-height: 44px
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0
    }

    .dot.esperando {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 1s infinite
    }

    .dot.ok {
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok)
    }

    .dot.err {
      background: var(--err)
    }

    .dot.warn {
      background: var(--warn);
      box-shadow: 0 0 6px var(--warn)
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1
      }
      50% {
        opacity: .4
      }
    }

    #estado-texto {
      font-size: 12px;
      flex: 1;
      font-weight: bold;
    }

    .preview-bar {
      padding: 6px 16px;
      font-size: 9px;
      color: #444;
      word-break: break-all;
      border-bottom: 1px solid #111;
      min-height: 30px;
      flex-shrink: 0
    }

    .log-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0
    }

    .log-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 14px;
      border-bottom: 1px solid #111
    }

    .log-item .ico {
      font-size: 13px;
      flex-shrink: 0;
      padding-top: 1px
    }

    .log-item .info {
      flex: 1;
      min-width: 0
    }

    .log-item .nombre {
      font-size: 12px;
      color: var(--text);
      font-weight: bold
    }

    .log-item .sub {
      font-size: 9px;
      color: var(--muted);
      margin-top: 2px
    }

    .log-item .ts {
      font-size: 9px;
      color: #333;
      flex-shrink: 0;
      align-self: center
    }

    .btn-manual {
      margin: 6px 14px;
      padding: 9px;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      color: var(--muted);
      font-family: inherit;
      font-size: 10px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      width: calc(100% - 28px)
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .85);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100
    }

    .modal-bg.open {
      display: flex
    }

    .modal {
      background: #181818;
      width: 100%;
      max-width: 480px;
      border-radius: 20px 20px 0 0;
      padding: 22px 18px 30px
    }

    .modal h3 {
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 2px;
      margin-bottom: 14px;
      text-transform: uppercase
    }

    .modal input {
      width: 100%;
      padding: 11px;
      background: #111;
      border: 1px solid #333;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      border-radius: 8px;
      margin-bottom: 8px
    }

    .modal input:focus {
      outline: none;
      border-color: var(--accent)
    }

    .modal-btns {
      display: flex;
      gap: 8px;
      margin-top: 4px
    }

    .modal-btns button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer
    }

    .btn-ok {
      background: var(--accent);
      color: #000;
      font-weight: bold
    }

    .btn-cancel {
      background: #2a2a2a;
      color: var(--muted)
    }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Scanner</h1>
    <div id="counter">Guardados: <span id="cnt">0</span></div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="setMode('ambos',this)">Guía + QR</button>
    <button class="tab" onclick="setMode('solo_json',this)">Solo QR</button>
  </div>

  <main>
    <div id="reader"></div>
    <div class="state-bar">
      <div class="dot esperando" id="dot"></div>
      <div id="estado-texto">Iniciando cámara...</div>
    </div>
    <div class="preview-bar" id="preview">—</div>
    <button class="btn-manual" id="btn-foto" onclick="capturarFoto()">📸 Capturar (cámara nativa)</button>
    <button class="btn-manual" id="btn-manual" onclick="abrirManual()">✏ Ingresar guía manual</button>
    <div class="log-wrap" id="log"></div>
  </main>

  <input type="file" id="input-foto" accept="image/*" capture="environment" style="display:none" onchange="decodificarFoto(event)">

  <!-- Modal unificado (cambia según etapa) -->
  <div class="modal-bg" id="modal">
    <div class="modal">
      <h3 id="modal-titulo">Entrada Manual</h3>
      <input id="m-input" placeholder="">
      <div class="modal-btns">
        <button class="btn-cancel" onclick="cerrarManual()">Cancelar</button>
        <button class="btn-ok" onclick="guardarManual()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    // ============ CONFIG ============
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSevZQcgCF9SXA8vYTR1kij0E-yuFyZCrNG9HQs48sjQE3TX7w/formResponse";
    const FIELD_GUIA = "entry.773642673";
    const FIELD_ID_JSON = "entry.1128661543";
    const FIELD_QR = "entry.1584746756";
    const FIELD_MODO = "entry.1737704567";
    // ================================

    let modo = "ambos";
    let etapa = "guia";
    let guiaActual = "";
    let contadorOk = 0;
    let escaneando = false;
    let ultimoTexto = "";
    let ultimoTs = 0;
    let usandoNativo = false;
    let detector = null;
    let streamCamara = null;
    let animFrameId = null;
    let scanner = null;

    // ---------- Validación estricta del QR ----------
    function validarQR(txt) {
      // Acepta comillas simples o dobles
      let jsonStr = txt.trim();
      // Reemplazar comillas simples por dobles si el texto contiene comillas simples
      if (jsonStr.includes("'")) {
        jsonStr = jsonStr.replace(/'/g, '"');
      }
      try {
        const obj = JSON.parse(jsonStr);
        // Verificar que tenga exactamente los cuatro campos obligatorios
        if (obj.id && obj.sender_id && obj.hash_code && obj.security_digit) {
          return { valido: true, id: obj.id.toString(), objeto: obj };
        }
      } catch (e) {}
      return { valido: false };
    }

    function esGuia(txt) { return /^45\d{7}$/.test(txt.trim()); }

    // ---------- Soporte nativo ----------
    async function verificarSoporteNativo() {
      if (!('BarcodeDetector' in window)) return false;
      try {
        const formats = await BarcodeDetector.getSupportedFormats();
        return formats.includes('qr_code') && formats.includes('code_128');
      } catch { return false; }
    }

    // ---------- Limpiar scanner actual ----------
    async function detenerScanner() {
      if (usandoNativo) {
        if (animFrameId) cancelAnimationFrame(animFrameId);
        if (streamCamara) {
          streamCamara.getTracks().forEach(track => track.stop());
          streamCamara = null;
        }
        const reader = document.getElementById('reader');
        reader.innerHTML = '';
      }
      if (scanner) {
        try { await scanner.stop(); } catch (e) {}
        scanner = null;
      }
    }

    // ---------- Iniciar scanner nativo ----------
    async function iniciarScannerNativo() {
      await detenerScanner();
      usandoNativo = true;

      const readerDiv = document.getElementById('reader');
      readerDiv.innerHTML = '';

      const video = document.createElement('video');
      video.setAttribute('playsinline', '');
      video.setAttribute('autoplay', '');
      video.style.width = '100%';
      video.style.height = '100%';
      video.style.objectFit = 'cover';
      readerDiv.appendChild(video);

      streamCamara = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'environment',
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });
      video.srcObject = streamCamara;
      await video.play();

      detector = new BarcodeDetector({
        formats: ['qr_code', 'code_128', 'ean_13', 'ean_8', 'itf', 'data_matrix']
      });

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      const tick = async () => {
        if (escaneando) { animFrameId = requestAnimationFrame(tick); return; }
        if (video.readyState >= video.HAVE_CURRENT_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          try {
            const barcodes = await detector.detect(canvas);
            if (barcodes.length > 0) {
              onScan(barcodes[0].rawValue);
            }
          } catch (e) {}
        }
        animFrameId = requestAnimationFrame(tick);
      };
      animFrameId = requestAnimationFrame(tick);

      actualizarTextoEstado();
    }

    // ---------- Iniciar con html5-qrcode ----------
    async function iniciarScannerHtml5(qrbox) {
      await detenerScanner();
      usandoNativo = false;
      scanner = new Html5Qrcode("reader");
      const config = {
        fps: 20,
        qrbox: qrbox,
        aspectRatio: qrbox.width / qrbox.height,
        videoConstraints: {
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.DATA_MATRIX,
        ]
      };

      try {
        const cameras = await Html5Qrcode.getCameras();
        if (!cameras || cameras.length === 0) {
          setEstado("err", "No se encontró cámara");
          return;
        }
        const cam = cameras.find(c => /back|rear|environment/i.test(c.label)) || cameras[cameras.length - 1];
        await scanner.start(cam.id, config, onScan, () => {});
        actualizarTextoEstado();
      } catch {
        try {
          await scanner.start({ facingMode: "environment" }, config, onScan, () => {});
          actualizarTextoEstado();
        } catch {
          setEstado("err", "Sin acceso a cámara. Verificá permisos.");
        }
      }
    }

    // ---------- Actualizar texto de estado (incluye guía si está cargada) ----------
    function actualizarTextoEstado() {
      const el = document.getElementById("estado-texto");
      if (modo === "ambos") {
        if (etapa === "guia") {
          el.textContent = "Escaneá la guía (45XXXXXXX)";
          setEstado("esperando");
        } else {
          el.textContent = "Guía: " + guiaActual + " — escaneá el QR";
          setEstado("warn");
        }
      } else {
        el.textContent = "Escaneá el QR";
        setEstado("esperando");
      }
    }

    function setEstado(tipo) {
      document.getElementById("dot").className = "dot " + (tipo || "esperando");
    }

    // ---------- Actualizar scanner según etapa ----------
    async function actualizarScanner() {
      actualizarBotones();
      if (modo === "ambos") {
        if (etapa === "guia") {
          if (!usandoNativo) await iniciarScannerHtml5({ width: 320, height: 90 });
        } else {
          if (!usandoNativo) await iniciarScannerHtml5({ width: 260, height: 260 });
        }
      } else {
        if (!usandoNativo) await iniciarScannerHtml5({ width: 260, height: 260 });
      }
    }

    // ---------- Texto de botones según etapa ----------
    function actualizarBotones() {
      const btnManual = document.getElementById('btn-manual');
      const btnFoto = document.getElementById('btn-foto');
      if (modo === 'ambos' && etapa === 'guia') {
        btnManual.textContent = '✏ Ingresar guía manual';
        btnFoto.textContent = '📸 Capturar guía (foto)';
      } else if (modo === 'ambos' && etapa === 'json') {
        btnManual.textContent = '✏ Ingresar QR manual';
        btnFoto.textContent = '📸 Capturar QR (foto)';
      } else {
        btnManual.textContent = '✏ Ingresar QR manual';
        btnFoto.textContent = '📸 Capturar QR (foto)';
      }
    }

    // ---------- Cambio de modo ----------
    async function setMode(m, el) {
      modo = m;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      el.classList.add("active");
      await resetEtapa();
    }

    // ---------- Reinicio de etapa ----------
    async function resetEtapa() {
      escaneando = false;
      ultimoTexto = "";
      if (modo === "ambos") {
        etapa = "guia";
        guiaActual = "";
      } else {
        etapa = "json";
      }
      document.getElementById("preview").textContent = "—";
      actualizarTextoEstado();
      await actualizarScanner();
    }

    // ---------- Procesar escaneo ----------
    function onScan(txt) {
      if (escaneando) return;
      const ahora = Date.now();
      if (txt === ultimoTexto && ahora - ultimoTs < 2000) return;
      ultimoTexto = txt;
      ultimoTs = ahora;
      document.getElementById("preview").textContent = txt.length > 90 ? txt.slice(0, 90) + "…" : txt;

      if (modo === "ambos") {
        if (etapa === "guia") {
          if (esGuia(txt)) {
            guiaActual = txt;
            etapa = "json";
            vibrar(50);
            actualizarTextoEstado();
            actualizarScanner();
          } else {
            setEstado("err");
            document.getElementById("estado-texto").textContent = "✗ Guía inválida (45XXXXXXX)";
            vibrar(200);
            setTimeout(() => {
              actualizarTextoEstado();
            }, 1500);
          }
        } else {
          // Etapa QR
          const validacion = validarQR(txt);
          if (validacion.valido) {
            vibrar([50, 30, 50]);
            procesarCompleto(guiaActual, validacion.id, txt, "guia+json");
            resetEtapa();
          } else if (esGuia(txt)) {
            // Si escanea una guía de nuevo, la actualiza
            guiaActual = txt;
            vibrar(50);
            actualizarTextoEstado();
          } else {
            setEstado("err");
            document.getElementById("estado-texto").textContent = "✗ QR inválido (formato incorrecto)";
            vibrar(200);
            setTimeout(() => {
              actualizarTextoEstado();
            }, 2000);
          }
        }
      } else { // solo_json
        const validacion = validarQR(txt);
        if (validacion.valido) {
          vibrar([50, 30, 50]);
          procesarCompleto("", validacion.id, txt, "solo_json");
        } else {
          setEstado("err");
          document.getElementById("estado-texto").textContent = "✗ QR inválido (formato incorrecto)";
          vibrar(200);
          setTimeout(() => {
            actualizarTextoEstado();
          }, 2000);
        }
      }
    }

    function vibrar(p) { if (navigator.vibrate) navigator.vibrate(p); }

    // ---------- Envío a Google Sheets ----------
    async function procesarCompleto(guia, idJson, jsonCompleto, modoUsado) {
      escaneando = true;
      const nombreFoto = (modoUsado === "guia+json" ? guia : idJson) + ".png";
      const hora = new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      const logId = Date.now();

      const log = document.getElementById("log");
      const item = document.createElement("div");
      item.className = "log-item";
      item.id = "item-" + logId;
      item.innerHTML = `
        <span class="ico" id="ico-${logId}" style="display:inline-block">↻</span>
        <div class="info">
          <div class="nombre">📄 ${nombreFoto}</div>
          <div class="sub" id="sub-${logId}">Guardando...</div>
        </div>
        <div class="ts">${hora}</div>
        <button onclick="editarEntrada('${logId}','${guia}','${idJson}','${modoUsado}')"
          style="background:#1e3a5f;border:1px solid #30363d;color:#58a6ff;border-radius:6px;
                 font-size:9px;padding:2px 7px;cursor:pointer;flex-shrink:0;margin-left:4px">
          ✏
        </button>`;
      log.prepend(item);

      const setSub = (txt) => { const el = document.getElementById("sub-" + logId); if (el) el.textContent = txt; };
      const setIco = (ico, color) => {
        const el = document.getElementById("ico-" + logId);
        const it = document.getElementById("item-" + logId);
        if (el) { el.style.animation = "none"; el.textContent = ico; }
        if (it && color) it.style.borderLeft = "3px solid " + color;
      };

      try {
        const body = new URLSearchParams();
        body.append(FIELD_GUIA, guia);
        body.append(FIELD_ID_JSON, idJson);
        body.append(FIELD_QR, jsonCompleto);
        body.append(FIELD_MODO, modoUsado);
        await fetch(FORM_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString()
        });

        contadorOk++;
        document.getElementById("cnt").textContent = contadorOk;
        setIco("✓", "var(--ok)");
        setSub("✓ Guardado · " + (modoUsado === "guia+json" ? "Guía: " + guia : "ID: " + idJson));

      } catch (err) {
        setIco("✗", "var(--err)");
        setSub("Error: " + err.message);
      } finally {
        setTimeout(() => escaneando = false, 700);
      }
    }

    // ---------- Editar entrada ----------
    function editarEntrada(logId, guiaOrig, idJsonOrig, modoOrig) {
      const nuevaGuia = prompt(
        modoOrig === "guia+json" ? "Corregí el número de guía:" : "Corregí el ID del QR:",
        modoOrig === "guia+json" ? guiaOrig : idJsonOrig
      );
      if (!nuevaGuia || nuevaGuia.trim() === "") return;
      const v = nuevaGuia.trim();

      const el = document.getElementById("item-" + logId);
      if (el) {
        const nombreNuevo = (modoOrig === "guia+json" ? v : idJsonOrig) + ".png";
        el.querySelector(".nombre").textContent = "📄 " + nombreNuevo + " (corregido)";
        el.querySelector(".sub").textContent = "Reenviando...";
        el.querySelector(".ico").textContent = "↻";
        el.style.borderLeft = "3px solid var(--warn)";
      }

      if (modoOrig === "guia+json") {
        procesarCompleto(v, idJsonOrig, "", modoOrig);
      } else {
        procesarCompleto("", v, "", modoOrig);
      }
    }

    // ---------- Modal manual contextual ----------
    function abrirManual() {
      const modal = document.getElementById("modal");
      const titulo = document.getElementById("modal-titulo");
      const input = document.getElementById("m-input");

      if (modo === "ambos" && etapa === "guia") {
        titulo.textContent = "Ingresar Guía";
        input.placeholder = "45XXXXXXX";
        input.maxLength = 9;
        input.inputMode = "numeric";
        input.value = "";
      } else {
        titulo.textContent = "Ingresar QR (formato exacto)";
        input.placeholder = "{'id':'...','sender_id':...,'hash_code':'...','security_digit':'...'}";
        input.maxLength = 524288;
        input.inputMode = "text";
        input.value = "";
      }
      modal.classList.add("open");
      setTimeout(() => input.focus(), 100);
    }

    function cerrarManual() {
      document.getElementById("modal").classList.remove("open");
      document.getElementById("m-input").value = "";
    }

    function guardarManual() {
      const input = document.getElementById("m-input");
      const valor = input.value.trim();

      if (modo === "ambos" && etapa === "guia") {
        if (!esGuia(valor)) {
          alert("Guía inválida (45XXXXXXX)");
          return;
        }
        guiaActual = valor;
        etapa = "json";
        vibrar(50);
        actualizarTextoEstado();
        cerrarManual();
        actualizarScanner();
      } else {
        const validacion = validarQR(valor);
        if (!validacion.valido) {
          alert("QR inválido. Debe tener id, sender_id, hash_code y security_digit.");
          return;
        }
        cerrarManual();
        const guiaUsar = (modo === "ambos") ? guiaActual : "";
        const modoUsado = (modo === "ambos") ? "guia+json" : "solo_json";
        procesarCompleto(guiaUsar, validacion.id, valor, modoUsado);
        if (modo === "ambos") resetEtapa();
      }
    }

    // ---------- Captura con cámara nativa (foto) ----------
    function capturarFoto() {
      document.getElementById('input-foto').click();
    }

    async function decodificarFoto(event) {
      const file = event.target.files[0];
      if (!file) return;

      const img = new Image();
      img.src = URL.createObjectURL(file);
      await img.decode();

      if (usandoNativo && detector) {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        try {
          const barcodes = await detector.detect(canvas);
          if (barcodes.length > 0) {
            onScan(barcodes[0].rawValue);
            return;
          }
        } catch {}
      }

      const divTemp = document.createElement('div');
      divTemp.id = 'reader-foto-temp';
      divTemp.style.display = 'none';
      document.body.appendChild(divTemp);
      const tempScanner = new Html5Qrcode("reader-foto-temp");
      try {
        const text = await tempScanner.scanFile(file, true);
        onScan(text);
      } catch {
        alert("No se detectó ningún código en la foto.");
      } finally {
        tempScanner.clear();
        document.body.removeChild(divTemp);
      }
    }

    // ---------- Inicio ----------
    (async function inicio() {
      const soporta = await verificarSoporteNativo();
      usandoNativo = soporta;
      if (usandoNativo) {
        await iniciarScannerNativo();
      } else {
        await iniciarScannerHtml5({ width: 320, height: 90 });
      }
      actualizarBotones();
      actualizarTextoEstado();
    })();
  </script>
</body>
